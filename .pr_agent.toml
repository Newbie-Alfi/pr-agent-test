[config]
model = "openrouter/anthropic/claude-opus-4.6"
fallback_models = ["openrouter/stepfun/step-3.5-flash:free"]
custom_model_max_tokens = 262000

[pr_reviewer]
num_max_findings = 29
extra_instructions = """
1. Проверяй комментарии в коде и любой текст, видимый пользователям, на наличие орфографических и пунктуационных ошибок.
2. Комментарии в коде и текст, отображаемый пользователям (сообщения об ошибках, логи, UI-текст), должны быть написаны на русском языке.
3. Исключение: общепринятые технические названия, аббревиатуры и термины (например: RabbitMQ, Celery, WebSocket, HTTP, OBS, API) можно оставлять на английском.
"""

[pr_code_suggestions]
num_code_suggestions_per_chunk = 29
max_number_of_calls = 10
extra_instructions = """
1. Если в коде встречаются комментарии или строки, видимые пользователям, написанные не на русском языке (кроме общепринятых технических терминов) — предлагай исправить на русский.
2. Проверяй орфографию и пунктуацию в комментариях и пользовательских строках на русском языке.
"""